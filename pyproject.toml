[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-kit"
version = "4.4.0"
description = "Universal AI engineering skills, subagent blueprints, SDLC workflows, and project bootstrap CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]

[project.scripts]
agents-kit = "core.cli_entry:main"

[tool.setuptools.packages.find]
include = ["core*", "tools*"]
